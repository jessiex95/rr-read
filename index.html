<style>
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; }
/* Layout: one fixed 1194x834 iPad-landscape stage, scaled to fit any screen. Single warm-paper look on purpose. */
:root {
  --paper: #FFF8EC;
  --card: #FFFFFF;
  --ink: #111111;
  --muted: #E6DCCB;
  --accent: #E2603F;
  --accent-deep: #B8452A;
  --hi: #FFE08A;
  --edge: #EADFCB;
  --font-read: 'Andika', 'Comic Neue', 'Trebuchet MS', sans-serif;
  --font-title: 'Fredoka', 'Andika', 'Trebuchet MS', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); overflow: hidden;
  font-family: var(--font-read);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#fit {
  height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
#frame { position: relative; overflow: hidden; }
#stage { width: 1194px; height: 834px; position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--paper); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible { outline: 4px solid #2C8C99; outline-offset: 3px; }
.ic { stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.ln { stroke: #26201E; stroke-width: 3; stroke-linecap: round; fill: none; }
.round { width: 72px; height: 72px; border-radius: 36px; background: var(--card); box-shadow: 0 2px 0 var(--edge); display: flex; align-items: center; justify-content: center; }
.round.go { background: var(--accent); color: #FFFFFF; box-shadow: 0 2px 0 var(--accent-deep); }
.round.on { background: var(--ink); color: #FFFFFF; box-shadow: none; }
.round[disabled] { opacity: .35; cursor: default; }

/* Library */
#library { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 40px; }
.book { width: 330px; display: flex; flex-direction: column; gap: 16px; text-align: left; }
.cover { width: 330px; height: 330px; border-radius: 28px; overflow: hidden; box-shadow: 0 8px 0 var(--edge); transition: transform .15s ease; }
.book:active .cover { transform: scale(.97); }
.cover svg { display: block; width: 100%; height: 100%; }
.btitle { font-family: var(--font-title); font-weight: 600; font-size: 34px; line-height: 1.1; color: var(--ink); }
.brand { position: absolute; left: 36px; top: 28px; display: flex; align-items: center; gap: 14px; }
.brand .logo { width: 64px; height: 64px; border-radius: 16px; overflow: hidden; box-shadow: 0 3px 0 var(--edge); }
.brand .logo svg { display: block; }
.brand span { font-family: var(--font-title); font-weight: 600; font-size: 34px; color: var(--ink); letter-spacing: .3px; }
.bar { height: 12px; border-radius: 6px; background: var(--muted); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }

/* Reader */
#reader { position: absolute; inset: 0; box-sizing: border-box; padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: center; }
.mid { flex: 1; display: flex; gap: 28px; min-height: 0; }
.art { width: 640px; height: 640px; border-radius: 28px; overflow: hidden; flex-shrink: 0; }
.art svg { display: block; width: 640px; height: 640px; }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; font-size: 40px; line-height: 1.32; color: var(--ink); }
.line { display: flex; flex-wrap: wrap; }
.w { padding: 0 5px; margin: 0 1px; border-radius: 12px; min-height: 52px; color: var(--ink); transition: background .12s; }
.w.hi { background: var(--hi); }
.bottom { display: flex; justify-content: space-between; align-items: center; }
.dots { display: flex; gap: 6px; align-items: center; }
.dot { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.dot span { display: block; width: 14px; height: 14px; border-radius: 7px; background: var(--muted); transition: width .2s, background .2s; }
.dot.seen span { background: #F2B19F; }
.dot.now span { width: 34px; background: var(--accent); }
.fade { animation: fade .25s ease; }
@keyframes fade { from { opacity: .3; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .cover, .w, .dot span { transition: none; } }
</style>

      if (s.stream) o += '<path d="M575 130 Q510 170 470 300 Q440 330 420 330 Q470 260 500 190 Q530 140 585 120Z" fill="#9AD6EE" opacity="0.9"></path>';
    }
    if (s.slide) {
      o += '<rect x="482" y="214" width="12" height="320" fill="#C9583C"></rect><rect x="598" y="214" width="12" height="320" fill="#C9583C"></rect>';
      o += '<path d="M610 214 V534 M640 214 V534" stroke="#B04A31" stroke-width="8"></path><path d="M610 260 H640 M610 310 H640 M610 360 H640 M610 410 H640 M610 460 H640 M610 510 H640" stroke="#B04A31" stroke-width="6"></path>';
      o += '<rect x="470" y="204" width="176" height="16" rx="4" fill="#B04A31"></rect>';
      o += '<path d="M470 210 Q420 300 380 400 Q330 520 150 545 L150 600 Q370 570 430 410 Q470 310 530 210Z" fill="#4FA3E0"></path>';
      o += '<path d="M500 210 Q446 305 406 405 Q352 545 150 572" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 10" fill="none"></path>';
    }
    if (s.mom) {

      o += '<path d="M-38 70 Q-44 0 0 0 Q44 0 38 70Z" fill="' + HAIR + '"></path><circle cx="0" cy="46" r="32" fill="' + FACE + '"></circle><path d="M-32 40 Q-28 8 0 10 Q28 8 32 40 Q16 24 0 26 Q-16 24 -32 40Z" fill="' + HAIR + '"></path>';
      o += '<circle cx="-11" cy="50" r="3.5" fill="' + HAIR + '"></circle><circle cx="11" cy="50" r="3.5" fill="' + HAIR + '"></circle><path class="ln" d="M-8 62 Q0 68 8 62"></path></g>';
    }

    if (s.zoom || s.zoomDog) o += '<path d="M40 420 H140 M20 470 H110 M60 520 H150" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path>';
    if (s.zoomDog) o += '<path d="M390 470 H450 M370 500 H440 M400 530 H450" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"></path>';
    o += ruiyou(s) + ruiyun(s);
    if (s.dog) {
      o += corgi(s.dog);
      if (s.leash) {
        var cx = s.dog.x + 36 * (s.dog.f || 1), cy = 504, h = hand(s, s.leash, cx);
        o += '<path d="M' + h[0] + ' ' + h[1] + ' Q' + ((h[0] + cx) / 2) + ' ' + (Math.max(h[1], cy) + 40) + ' ' + cx + ' ' + cy + '" stroke="#E0412B" stroke-width="4" fill="none" stroke-linecap="round"></path>';

    if (s.ball) o += '<circle cx="470" cy="330" r="18" fill="#E0412B"></circle><path d="M454 322 Q470 338 486 322" stroke="#F5D33D" stroke-width="4" fill="none"></path><path d="M560 400 Q520 330 490 332" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="6 8" fill="none"></path>';
    if (s.hearts) o += '<g fill="#E2603F"><path transform="translate(360 400)" d="M0 10 C-20 -6 -12 -22 0 -12 C12 -22 20 -6 0 10Z"></path><path transform="translate(320 360) scale(.7)" d="M0 10 C-20 -6 -12 -22 0 -12 C12 -22 20 -6 0 10Z"></path><path transform="translate(400 350) scale(.8)" d="M0 10 C-20 -6 -12 -22 0 -12 C12 -22 20 -6 0 10Z"></path></g>';
    if (s.river) o += '<path d="M0 530 Q340 510 680 530 L680 680 L0 680Z" fill="#6CC3E6" opacity="0.92"></path><path d="M60 570 q20 -8 40 0 t40 0 M320 590 q20 -8 40 0 t40 0 M520 560 q20 -8 40 0 t40 0" stroke="#FFFFFF" stroke-width="3" fill="none"></path>';

  }

  /* ---------- Speech ---------- */
  var SAY = { "Ruiyou": "Ray-yo", "Ruiyun": "Ray-yoon", "Ruiyun's": "Ray-yoon's" };
  var PREF = ["Microsoft Ava Online (Natural)", "Microsoft Jenny Online (Natural)", "Microsoft Aria Online (Natural)", "Microsoft Emma Online (Natural)",
    "Ava (Premium)", "Zoe (Premium)", "Ava (Enhanced)", "Zoe (Enhanced)", "Samantha (Enhanced)", "Allison (Enhanced)", "Susan (Enhanced)",
    "Google US English", "Ava", "Zoe", "Samantha", "Allison", "Susan", "Nicky", "Karen", "Moira", "Tessa"];
  var FEMALE = /(ava|zoe|samantha|allison|susan|nicky|karen|moira|tessa|jenny|aria|emma|victoria|fiona|kate)/i;
  var voice = null;
  function pickVoice() {
    try {
      var en = (window.speechSynthesis.getVoices() || []).filter(function (v) { return /^en/i.test(v.lang); });
      for (var i = 0; i < PREF.length; i++) {
        var p = PREF[i];
        var hit = en.find(function (v) { return v.name === p; }) || en.find(function (v) { return v.name.indexOf(p) === 0; });
        if (hit) return hit;
      }
      return en.find(function (v) { return FEMALE.test(v.name); }) || en[0] || null;
    } catch (e) { return null; }
  }
  try { if (window.speechSynthesis) { voice = pickVoice(); window.speechSynthesis.onvoiceschanged = function () { voice = pickVoice(); }; } } catch (e) {}
  function stopSpeech() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} }
  function speak(text, onBoundary, onEnd) {
    try {
      var ss = window.speechSynthesis;
      if (!ss) { onEnd && onEnd(); return; }
      ss.cancel();
      var u = new SpeechSynthesisUtterance(text);
      if (!voice) voice = pickVoice();
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
      u.rate = 0.9; u.pitch = 1;
      if (onBoundary) u.onboundary = onBoundary;
      u.onend = function () { onEnd && onEnd(); };
      u.onerror = function () { onEnd && onEnd(); };
      ss.speak(u);
    } catch (e) { onEnd && onEnd(); }
  }
  function clean(t) { return t.replace(/[^A-Za-z']/g, ""); }

  /* ---------- Progress (this device only) ---------- */
  function getProg(id) { try { var v = parseInt(localStorage.getItem("ss_" + id), 10); return isNaN(v) ? -1 : v; } catch (e) { return -1; } }
  function setProg(id, p) { try { if (p > getProg(id)) localStorage.setItem("ss_" + id, String(p)); localStorage.setItem("ss_at_" + id, String(p)); } catch (e) {} }
  function getAt(id) { try { var v = parseInt(localStorage.getItem("ss_at_" + id), 10); return isNaN(v) ? 0 : v; } catch (e) { return 0; } }

  /* ---------- Screens ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var book = null, page = 0, reading = false, wordEls = [];

  function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  function showLibrary() {
    stopSpeech(); reading = false;
    $("reader").hidden = true; $("library").hidden = false; $("brand").hidden = false;
    $("library").innerHTML = BOOKS.map(function (b, i) {
      var done = Math.max(0, getProg(b.id) + 1);
      return '<button class="book" data-b="' + i + '" aria-label="Open ' + esc(b.title) + '">' +
        '<div class="cover">' + sceneSVG(b.pages[b.cover].s) + '</div>' +
        '<div class="btitle">' + esc(b.title) + '</div>' +
        '<div class="bar" aria-hidden="true"><span style="width:' + (done * 10) + '%"></span></div></button>';
    }).join("");
  }

  function openBook(i) {
    book = BOOKS[i];
    var at = getAt(book.id);
    page = (at >= 9 || at < 0) ? 0 : at;
    $("library").hidden = true; $("brand").hidden = true; $("reader").hidden = false;
    renderPage();
  }

  function setReadBtn() {
    var b = $("read");
    b.innerHTML = reading ? ICON_STOP : ICON_SPEAK;
    b.classList.toggle("on", reading);
    b.setAttribute("aria-label", reading ? "Stop reading" : "Read this page to me");
  }

  function highlight(i) {
    wordEls.forEach(function (el, k) { el.classList.toggle("hi", k === i); });
  }

  function renderPage() {
    stopSpeech(); reading = false; setReadBtn();
    setProg(book.id, page);
    var pg = book.pages[page];
    $("art").innerHTML = sceneSVG(pg.s);
    $("art").classList.remove("fade"); void $("art").offsetWidth; $("art").classList.add("fade");
    var idx = 0;
    $("text").innerHTML = pg.t.map(function (line) {
      return '<div class="line">' + line.split(" ").map(function (w) {
        var c = clean(w);
        return '<button class="w" data-i="' + (idx++) + '" data-say="' + esc(SAY[c] || c) + '" aria-label="' + esc(c) + '">' + esc(w) + '</button>';
      }).join("") + '</div>';
    }).join("");
    wordEls = Array.prototype.slice.call($("text").querySelectorAll(".w"));
    $("prev").disabled = page === 0;
    var last = page === book.pages.length - 1;
    $("next").innerHTML = last ? ICON_AGAIN : ICON_NEXT;
    $("next").setAttribute("aria-label", last ? "Read the book again" : "Next page");
    $("dots").innerHTML = book.pages.map(function (_, i) {
      return '<button class="dot' + (i === page ? " now" : (i < page ? " seen" : "")) + '" data-p="' + i + '" aria-label="Page ' + (i + 1) + '"><span></span></button>';
    }).join("");
  }

  function readPage() {
    if (reading) { stopSpeech(); reading = false; setReadBtn(); highlight(-1); return; }
    var words = wordEls.map(function (el) { return el.getAttribute("data-say"); });
    var offs = [], pos = 0;
    words.forEach(function (w) { offs.push(pos); pos += w.length + 1; });
    reading = true; setReadBtn(); highlight(0);
    speak(words.join(" "), function (e) {
      var k = 0; for (var j = 0; j < offs.length; j++) if (offs[j] <= e.charIndex) k = j;
      highlight(k);
    }, function () { reading = false; setReadBtn(); highlight(-1); });
  }

  $("library").addEventListener("click", function (e) {
    var b = e.target.closest(".book"); if (b) openBook(+b.getAttribute("data-b"));
  });
  $("text").addEventListener("click", function (e) {
    var w = e.target.closest(".w"); if (!w) return;
    reading = false; setReadBtn();
    var i = +w.getAttribute("data-i"); highlight(i);
    speak(w.getAttribute("data-say"), null, function () { highlight(-1); });
  });
  $("dots").addEventListener("click", function (e) {
    var d = e.target.closest(".dot"); if (d) { page = +d.getAttribute("data-p"); renderPage(); }
  });
  $("home").addEventListener("click", showLibrary);
  $("read").addEventListener("click", readPage);
  $("prev").addEventListener("click", function () { if (page > 0) { page--; renderPage(); } });
  $("next").addEventListener("click", function () { page = page === book.pages.length - 1 ? 0 : page + 1; renderPage(); });

  /* Swipe to turn pages */
  var sx = null;
  $("reader").addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  $("reader").addEventListener("touchend", function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) < 80) return;
    if (dx < 0 && page < book.pages.length - 1) { page++; renderPage(); }
    else if (dx > 0 && page > 0) { page--; renderPage(); }
  }, { passive: true });

  /* Fit the 1194x834 stage to the screen */
  function fit() {
    var f = $("fit"), cs = getComputedStyle(f);
    var w = f.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var h = f.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var k = Math.max(0.1, Math.min(w / 1194, h / 834));
    $("frame").style.width = (1194 * k) + "px"; $("frame").style.height = (834 * k) + "px";
    $("stage").style.transform = "scale(" + k + ")";
  }
  window.addEventListener("resize", fit);
  fit();
  showLibrary();
})();
